<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FarmaGrid+</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      background-image: url('senhaEsquecida.jpeg');
      background-position: center;
      background-size: cover;
      display: flex;
      align-items: center;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .left-column {
      width: 420px;
      margin-right: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 82vh;
    }

    .login-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .centered {
      align-self: center;
      text-align: center;
      width: 100%;
    }

    /* ===== LOGO ===== */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #355e3b;
      margin-bottom: 12px;
      letter-spacing: 0.6px;
    }

    .logo span { color: #4BA94B; }

    .plus-icon {
        width: 40px;      
        height: 40px;
        position: relative;
        top: -20px;       

    }

    .titulo {
      font-size: 24px;
      font-weight: 700;
      color: #2e462e;
      margin-bottom: 6px;
    }

    .legenda {
      font-size: 24px;
      font-weight: 700;
      color: #2e462e;
      margin-top: 80px;
      margin-bottom: 20px;
    }

    .subtitulo {
      font-size: 16px;
      color: #2e462e;
      margin-bottom: 6px;
    }

    /* --- FORMULÁRIO --- */
    .form-inner {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-self: center;
    }

    .form-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #2e462e;
      margin-bottom: -2px;
      display: block;
    }

    .input-icon {
      position: relative;
      width: 100%;
    }

    .input-icon input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 12px;
      border-radius: 8px;
      border: 1.5px solid #4BA94B;
      background: transparent;
      outline: none;
      color: #2e462e;
      transition: all .15s ease;
      font-size: 14px;
    }

    .input-icon input:focus {
      border-color: #2f6d2f;
      box-shadow: 0 0 6px rgba(75, 169, 75, 0.25);
    }

    .input-icon img {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.8;
      pointer-events: none;
    }

    /* Checkbox */
    .remember input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.8px solid #4BA94B;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      transition: all 0.2s ease;
      position: relative;
    }

    .remember input[type="checkbox"]:checked {
      background-color: #4BA94B;
      border-color: #4BA94B;
    }

    .remember input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #2e462e;
      font-size: 14px;
      margin-top: 4px;
    }

    .social {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 4px;
    }

    .social .icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: transparent;
      border: 1.5px solid #4BA94B;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .social img {
      width: 30px;
      height: 30px;
    }

    .social .icon:hover {
      background-color: rgba(75,169,75,0.08);
      border-color: #2f6d2f;
    }

    .enviar {
      width: 320px;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: #2f4f2f;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.18);
      margin-top: 6px;
      margin-bottom: 10px;
      align-self: center;
      transition: 0.2s ease;
    }

    .enviar:hover { background: #355e3b; }

    .esqueci {
      font-size: 13px;
      font-weight: 600;
      color: #2e462e;
      text-decoration: none;
      align-self: center;
    }

    .esqueci:hover { text-decoration: underline; }

    .social .icon.selected {
      background-color: rgba(75,169,75,0.12);
      border-color: #2f6d2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-column">
      <div class="login-box">
        <div class="centered">
          <!-- LOGO COM IMAGEM DO "+" -->
          <div class="logo">
            FARMA<span>GRID</span>
            <img src="LogoFarmaGrid.png" alt="Símbolo de mais" class="plus-icon" />
          </div>
          <div class="titulo">Esqueceu sua senha?</div>
          <p class="subtitulo">Não se preocupe. Nós podemos te ajudar!</p>
          <div class="legenda">Informe o e-mail para o qual deseja redefinir sua senha.</div>
        </div>

        <div class="form-inner">
          <div class="form-group">
            <label for="email">Email:</label>
            <div class="input-icon">
              <input id="email" type="email" />
              <img src="email.png" alt="Ícone de email" />
            </div>
          </div>
        </div>

        <button class="enviar">Enviar</button>
        <a class="esqueci" href="index.html">Lembrou sua senha? Volte para o Login!</a>
      </div>
    </div>
  </div>




</body>
</html>
