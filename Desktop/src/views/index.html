<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FarmaGrid+</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      background-image: url('testando.png');
      background-position: center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .left-column {
      width: 420px;
      margin-left: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 82vh;
    }

    .login-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .centered {
      align-self: center;
      text-align: center;
      width: 100%;
    }

    /* ===== LOGO ===== */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #355e3b;
      margin-bottom: 2px;
      letter-spacing: 0.6px;
    }

    .logo span { color: #4BA94B; }

    .plus-icon {
        width: 40px;      
        height: 40px;
        position: relative;
        top: -20px;       

    }





    .titulo {
      font-size: 24px;
      font-weight: 700;
      color: #2e462e;
      margin-bottom: 6px;
    }

    /* --- FORMULÁRIO --- */
    .form-inner {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-self: center;
    }

    .form-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #2e462e;
      margin-bottom: -2px;
      display: block;
    }

    .input-icon {
      position: relative;
      width: 100%;
    }

    .input-icon input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 12px;
      border-radius: 8px;
      border: 1.5px solid #4BA94B;
      background: transparent;
      outline: none;
      color: #2e462e;
      transition: all .15s ease;
      font-size: 14px;
    }

    .input-icon input:focus {
      border-color: #2f6d2f;
      box-shadow: 0 0 6px rgba(75, 169, 75, 0.25);
    }

    .input-icon img {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.8;
      pointer-events: none;
    }

    /* Checkbox */
    .remember input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.8px solid #4BA94B;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      transition: all 0.2s ease;
      position: relative;
    }

    .remember input[type="checkbox"]:checked {
      background-color: #4BA94B;
      border-color: #4BA94B;
    }

    .remember input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #2e462e;
      font-size: 14px;
      margin-top: 4px;
    }

    .entrar-com {
      font-size: 15px;
      font-weight: 600;
      color: #2e462e;
      margin-bottom: 6px;
    }

    .social {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 4px;
    }

    .social .icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: transparent;
      border: 1.5px solid #4BA94B;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .social img {
      width: 30px;
      height: 30px;
    }

    .social .icon:hover {
      background-color: rgba(75,169,75,0.08);
      border-color: #2f6d2f;
    }

    .entrar {
      width: 320px;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #2f4f2f;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.18);
      margin-top: 6px;
      margin-bottom: 10px;
      align-self: center;
      transition: 0.2s ease;
    }

    .entrar:hover { background: #355e3b; }

    .esqueci {
      font-size: 13px;
      font-weight: 600;
      color: #2e462e;
      text-decoration: none;
      align-self: center;
    }

    .esqueci:hover { text-decoration: underline; }

    .social .icon.selected {
      background-color: rgba(75,169,75,0.12);
      border-color: #2f6d2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-column">
      <div class="login-box">
        <div class="centered">
          <!-- LOGO COM IMAGEM DO "+" -->
          <div class="logo">
            FARMA<span>GRID</span>
            <img src="LogoFarmaGrid.png" alt="Símbolo de mais" class="plus-icon" />
          </div>
          <div class="titulo">Login</div>
        </div>

        <div class="form-inner">
          <div class="form-group">
            <label for="email">Email:</label>
            <div class="input-icon">
              <input id="email" type="email" />
              <img src="login.png" alt="Ícone de email" />
            </div>
          </div>

          <div class="form-group">
            <label for="senha">Senha:</label>
            <div class="input-icon">
              <input id="senha" type="password" />
              <img src="senha.png" alt="Ícone de senha" />
            </div>
          </div>

          <div class="remember">
            <input id="lembrar" type="checkbox" />
            <label for="lembrar">Lembrar de mim</label>
          </div>
        </div>

        <div class="centered" style="margin-top:6px">
          <div class="entrar-com">Entrar com:</div>
          <div class="social">
            <button class="icon" id="medicoLogin"><img src="medico.png" alt="Google"></button>
            <button class="icon" id="farmaciaLogin"><img src="farmacia.png" alt="Apple"></button>
          </div>
          <div class="social">
            <span class="entrar-com">Médico</span>
            <span class="entrar-com">Fármacia</span>
          </div>
        </div>

        <button class="entrar">Entrar</button>
        <a class="esqueci" href="#">Esqueceu sua senha?</a>
      </div>
    </div>
  </div>


  <script>
  let tipoSelecionado = null; // 1 = médico, 2 = farmácia

  // Selecionar o botão Médico ou Farmácia
  const botaoMedico = document.getElementById('medicoLogin');
  const botaoFarmacia = document.getElementById('farmaciaLogin');
  const botoesTipo = [botaoMedico, botaoFarmacia];

  botoesTipo.forEach(botao => {
    botao.addEventListener('click', () => {
      // Remove seleção anterior
      botoesTipo.forEach(b => b.classList.remove('selected'));

      // Adiciona classe no clicado
      botao.classList.add('selected');

      // Define o tipo
      if (botao.id === 'medicoLogin') tipoSelecionado = 1;
      if (botao.id === 'farmaciaLogin') tipoSelecionado = 2;
    });
  });

  // Botão de Entrar
  const botaoEntrar = document.querySelector('.entrar');

  botaoEntrar.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();

    if (!email || !senha) {
      Swal.fire({
        icon: 'warning',
        title: 'Campos vazios',
        text: 'Por favor, preencha o email e a senha!',
      });
      return;
    }

    if (!tipoSelecionado) {
      Swal.fire({
        icon: 'info',
        title: 'Selecione o tipo de login',
        text: 'Escolha se você é Médico ou Farmácia antes de continuar.',
      });
      return;
    }

    try {
      const user = await window.electronAPI.login(email, senha, tipoSelecionado);

      if (user) {
        Swal.fire({
          icon: 'success',
          title: 'Login realizado!',
          text: `Bem-vindo(a) ${user.nome || ''}!`,
          timer: 1500,
          showConfirmButton: false
        }).then(() => {

          if (user.perfil === "medico") {
            window.electronAPI.abrirJanelaIndex();

          } else if (user.perfil === "farmacia") {
            window.electronAPI.abrirJanelaD();

          } else if (user.perfil === "balconista") {
            window.electronAPI.abrirJanelaBalconista();

          } else if (user.perfil === "caixa") {
            window.electronAPI.abrirJanelaCaixa();

          } else {
            Swal.fire({
              icon: 'error',
              title: 'Perfil desconhecido',
              text: 'Não foi possível identificar o tipo de usuário.',
            });
          }

        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Erro no login',
          text: 'Email, senha ou tipo incorretos!',
        });
      }
    } catch (err) {
      console.error('Erro ao tentar logar:', err);
      Swal.fire({
        icon: 'error',
        title: 'Erro inesperado',
        text: 'Ocorreu um erro ao conectar ao banco de dados.',
      });
    }
  });
</script>



</body>
</html>
